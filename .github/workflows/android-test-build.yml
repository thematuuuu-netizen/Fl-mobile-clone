name: Android test build (base APK)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/android-test-build.yml']

jobs:
  android-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.91.0
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-arm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android build tools
        run: |
          sudo apt-get update && sudo apt-get install -y libclang-dev
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.0.13004108'
          cargo install cargo-ndk --version 4.1.2 --locked
      - name: Build base debug APK (no sounds)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          tools/android-dist.sh --base
      - uses: actions/upload-artifact@v4
        with:
          name: honeydew-android-base-debug
          path: target/honeydew-android-*-arm*.apk
          if-no-files-found: error
